<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Schedule</title>
<style>
/* Visual language aligned with the confirmed E-182 prototype: dark base,
   per-type accent colors, card surfaces, quiet chrome. */
:root{
  --bg:#0a0c0f; --bg2:#0e1116; --card:#12151a; --card2:#171b21; --line:#232932; --line2:#2c333e;
  --ink:#e8eaed; --muted:#8b93a1; --faint:#5c6470;
  --brand:#7c8cff; --brand-soft:rgba(124,140,255,.13);
  --ok:#4ade80; --ok-soft:rgba(74,222,128,.13);
  --warn:#fbbf24; --warn-soft:rgba(251,191,36,.13);
  --bad:#f87171; --bad-soft:rgba(248,113,113,.13);
  --t-asme:#7fe0c3; --t-bot:#76b8ff; --t-report:#f2b24c; --t-outreach:#f58d7a; --t-agent:#b9a4ff; --t-jira:#e2a4ff;
  --radius:14px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 500px at 70% -10%,rgba(124,140,255,.07),transparent),var(--bg);color:var(--ink);min-height:100vh}
a{color:var(--brand);text-decoration:none}
::selection{background:rgba(124,140,255,.3)}
.topbar{background:rgba(10,12,15,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;gap:20px;align-items:center;position:sticky;top:0;z-index:10}
.topbar .logo{font-weight:700;font-size:15px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.topbar .logo .dot{width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,var(--brand),var(--t-agent))}
.topbar nav{display:flex;gap:2px}
.topbar nav a{color:var(--muted);padding:6px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;transition:.15s}
.topbar nav a:hover{color:var(--ink);background:var(--card2)}
.topbar nav a.active{color:var(--ink);background:var(--brand-soft)}
.topbar .spacer{flex:1}
.topbar .who{color:var(--muted);font-size:12.5px}
.wrap{max-width:1100px;margin:26px auto;padding:0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=password],input[type=number],input[type=datetime-local],select,textarea{border:1px solid var(--line2);border-radius:9px;padding:8px 11px;font-size:14px;background:var(--bg2);color:var(--ink);font-family:inherit;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
textarea{width:100%;min-height:70px;resize:vertical}
button{background:var(--brand);color:#0a0c0f;border:0;border-radius:9px;padding:8px 15px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
button:hover{filter:brightness(1.08)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);font-weight:500}
button.ghost:hover{border-color:var(--muted)}
button.small{padding:4px 11px;font-size:12.5px}
button.danger{background:transparent;color:var(--bad);border:1px solid rgba(248,113,113,.35);font-weight:500}
button.danger:hover{background:var(--bad-soft)}
button:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 11px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.active{background:var(--ok-soft);color:var(--ok)}
.pill.paused{background:rgba(139,147,161,.13);color:var(--muted)}
.pill.inactive{background:var(--warn-soft);color:var(--warn)}
.pill.needs_attention{background:var(--bad-soft);color:var(--bad)}
.pill.pending,.pill.leased,.pill.dispatched{background:var(--brand-soft);color:var(--brand)}
.pill.completed,.pill.succeeded{background:var(--ok-soft);color:var(--ok)}
.pill.failed{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:1px 8px;font-size:11.5px;margin-right:6px;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
tr:last-child td{border-bottom:0}
th{color:var(--faint);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.viewtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.viewtabs .vt{padding:5px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:12.5px;color:var(--muted);transition:.15s}
.viewtabs .vt:hover{color:var(--ink);border-color:var(--line2)}
.viewtabs .vt.active{background:var(--brand-soft);color:var(--ink);border-color:rgba(124,140,255,.4)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:var(--bg2);border-left:1px solid var(--line);overflow-y:auto;padding:26px;transform:translateX(100%);transition:.22s;z-index:20}
.drawer.open{transform:none}
.backdrop{position:fixed;inset:0;background:rgba(2,4,8,.6);backdrop-filter:blur(2px);display:none;z-index:15}
.backdrop.show{display:block}
h2{font-size:17px;margin:0 0 10px;font-weight:650}
h3{font-size:13px;margin:20px 0 8px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--muted);font-size:12.5px}
.run{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px;font-size:13px;background:var(--card)}
.badge{font-size:11.5px;border-radius:6px;padding:1px 8px;font-weight:500}
.badge.pub-published{background:var(--ok-soft);color:var(--ok)}
.badge.pub-paused{background:var(--warn-soft);color:var(--warn)}
.badge.pub-skipped{background:rgba(139,147,161,.13);color:var(--muted)}
.badge.pub-pending{background:var(--brand-soft);color:var(--brand)}
.badge.none{background:rgba(139,147,161,.1);color:var(--faint)}
.typeic{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;font-size:14px;flex:none}
.trow-title{font-weight:600;font-size:14px}
.empty{color:var(--faint);text-align:center;padding:36px 0;font-size:13px}
.kbd{font:11px ui-monospace,monospace;background:var(--card2);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--muted)}
.notice{border:1px solid rgba(124,140,255,.3);background:var(--brand-soft);border-radius:11px;padding:10px 14px;font-size:12.5px;color:var(--ink);margin-bottom:12px}
</style>
</head>
<body>
<div id="app"></div>
<div class="backdrop" id="backdrop"></div>
<div class="drawer" id="drawer"></div>

<script>
const S = { user: null, view: 'tasks', sub: 'all', tasks: [], tags: [], shares: [], q: '', detail: null };
window.addEventListener('message', (event) => {
  if (event.origin !== location.origin) return;
  const data = event.data;
  if (!data || data.channel !== 'personal-schedule-extension-v1' || data.type !== 'ready') return;
  EXT.ready = true;
  EXT.version = data.version || null;
});
const api = (path, opts) => fetch(`/api/v1${path}`, {
  headers: { 'Content-Type': 'application/json' }, credentials: 'include', ...opts,
}).then(async (r) => ({ status: r.status, body: await r.json().catch(() => ({})) }));
const esc = (s) => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
const $ = (sel, el = document) => el.querySelector(sel);
const TYPE_LABEL = { asme: '以我发送', bot: 'Bot 发送', ai_report: 'AI Report', outreach: '帮我问', agent_task: '帮我做', jira_automation: 'JIRA 托管' };

const AUTH_META = { domains: ['ringcentral.com'], devFallback: true };
const EXT = { ready: false, version: null };

async function boot() {
  let me = await api('/me');
  // open-and-use: no session yet -> create a guest session so the app is
  // immediately usable; data lives under the guest account until the user
  // clicks 保存并登录 (email code / extension / token) and gets merged.
  if (me.status !== 200) {
    const g = await api('/auth/guest', { method: 'POST', body: '{}' });
    if (g.status === 200) me = { status: 200, body: g.body };
  }
  const meta = await api('/auth/meta');
  if (meta.status === 200) Object.assign(AUTH_META, meta.body);
  if (me.status === 200) { S.user = me.body; await reload(); }
  else renderLogin();
}
function renderLogin() {
  $('#app').innerHTML = `
  <div class="wrap" style="max-width:430px;margin-top:14vh">
    <div class="card">
      <h2>Personal Schedule</h2>
      <div class="muted" style="margin-bottom:12px">邮箱验证码登录（限 ${esc(AUTH_META.domains.join(' / '))}）；也可使用 Personal AI 扩展或登录令牌。</div>
      <div class="field"><input type="text" id="email" placeholder="name@${esc(AUTH_META.domains[0] || 'ringcentral.com')}"></div>
      <div class="row">
        <input type="text" id="code" placeholder="6 位验证码" style="flex:1;min-width:140px">
        <button class="ghost" id="send-code">获取验证码</button>
      </div>
      <div class="muted" id="code-note" style="margin-bottom:10px"></div>
      <button id="login-email" style="width:100%">登录 / 注册</button>
      <div class="row" style="margin-top:14px;justify-content:space-between">
        <button class="ghost small" id="use-ext">使用 Chrome 扩展登录</button>
        <button class="ghost small" id="use-token">使用登录令牌（高级）</button>
      </div>
      <div id="tok-wrap" style="display:none;margin-top:12px">
        <div class="field"><input type="password" id="tok" placeholder="pst_..."></div>
        <button id="go" style="width:100%">用令牌登录</button>
      </div>
      <div id="ext-wrap" style="display:none;margin-top:12px">
        <div class="muted" id="ext-note" style="margin-bottom:8px">检测 Personal AI 扩展…安装扩展并在其 Options 保存本站连接后，回到本页点击下方按钮即可登录（令牌不进入网页）。</div>
        <button id="ext-login" style="width:100%">请求扩展登录</button>
      </div>
    </div>
  </div>`;
  AUTH_WIRE();
}
function AUTH_WIRE() {
  $('#send-code').onclick = async () => {
    const email = $('#email').value.trim();
    const r = await api('/auth/email/request', { method: 'POST', body: JSON.stringify({ email }) });
    if (r.status === 200) {
      $('#code-note').textContent = r.body.devFallback
        ? '验证码已生成（开发回退：码已写入服务器日志；配置 RESEND_API_KEY 后自动改为邮件发送）'
        : `验证码已发送到邮箱（${r.body.expiresInMinutes} 分钟内有效）`;
    } else $('#code-note').textContent = r.body.error || '发送失败';
  };
  $('#login-email').onclick = async () => {
    const r = await api('/auth/email/verify', { method: 'POST', body: JSON.stringify({ email: $('#email').value.trim(), code: $('#code').value.trim() }) });
    if (r.status === 200) {
      if (r.body.merged) alert('访客数据已并入你的账号');
      location.href = '/app';
    } else alert(r.body.error || '验证失败');
  };
  $('#use-token').onclick = () => { const w = $('#tok-wrap'); w.style.display = w.style.display === 'none' ? '' : 'none'; };
  $('#use-ext').onclick = () => { const w = $('#ext-wrap'); w.style.display = w.style.display === 'none' ? '' : 'none'; };
  const go = async () => {
    const r = await api('/auth/login', { method: 'POST', body: JSON.stringify({ token: $('#tok').value.trim() }) });
    if (r.status === 200) {
      if (r.body.merged) alert('访客数据已并入你的账号');
      location.href = '/app';
    } else alert('Token 无效');
  };
  $('#go').onclick = go;
  $('#tok').onkeydown = (e) => e.key === 'Enter' && go();
  $('#ext-login').onclick = () => {
    if (!EXT.ready) { $('#ext-note').textContent = '未检测到扩展——请先安装 Personal AI 扩展并在其 Options 保存本站连接。'; return; }
    // ask the extension to log this tab in; the extension performs the
    // same-origin login itself — the long-lived PAT never enters page JS.
    window.postMessage({ channel: 'personal-schedule-extension-v1', type: 'login-request' }, location.origin);
    $('#ext-note').textContent = '已向扩展发送登录请求…';
  };
}

// the "保存并登录" view (guest -> real account merge)
function openAuth() {
  renderLogin();
  const note = document.createElement('div');
  note.className = 'notice';
  note.textContent = '当前为访客模式：把要保存的任务创建好，登录后会自动并入你的账号。';
  $('#app').querySelector('.card').prepend(note);
}

async function refresh() {
  const [tasks, tags, shares] = await Promise.all([api('/tasks'), api('/tags'), api('/shares')]);
  S.tasks = tasks.body || []; S.tags = tags.body || []; S.shares = shares.body || [];
}

function render() {
  if (!S.user) return renderLogin();
  const nav = `
  <div class="topbar">
    <span class="logo"><span class="dot"></span>Personal Schedule</span>
    <nav>
      <a data-v="tasks" class="${S.view==='tasks'?'active':''}">任务</a>
      <a data-v="tags" class="${S.view==='tags'?'active':''}">标签</a>
      <a data-v="shares" class="${S.view==='shares'?'active':''}">分享</a>
      <a data-v="settings" class="${S.view==='settings'?'active':''}">设置</a>
    </nav>
    <span class="spacer"></span>
    ${S.user.isGuest ? '<span class="pill paused">访客模式</span>' : `<span class="muted">${esc(S.user.email)}</span>`}
    ${S.user.isGuest ? '<button class="small" id="save-login">保存并登录</button>' : '<button class="ghost small" id="logout">退出</button>'}
  </div>`;
  const pages = { tasks: pageTasks, tags: pageTags, shares: pageShares, settings: pageSettings };
  $('#app').innerHTML = nav + `<div class="wrap">${pages[S.view]()}</div>`;
  document.querySelectorAll('.topbar nav a').forEach((a) => a.onclick = () => { S.view = a.dataset.v; render(); });
  const lo = $('#logout');
  if (lo) lo.onclick = async () => { await api('/auth/logout', { method: 'POST' }); location.reload(); };
  const sl = $('#save-login');
  if (sl) sl.onclick = openAuth;
  wire(S.view);
}

function viewTabs() {
  const needBadge = S.tasks.filter((t) => t.status === 'inactive').length;
  let tabs = `<div class="vt ${S.sub==='all'?'active':''}" data-s="all">全部</div>`;
  for (const tag of S.tags) tabs += `<div class="vt ${S.sub==='tag:'+tag.id?'active':''}" data-s="tag:${tag.id}">#${esc(tag.name)}</div>`;
  for (const type of ['asme','bot','ai_report','outreach','agent_task','jira_automation']) {
    const count = S.tasks.filter((t) => t.type === type).length;
    if (count) tabs += `<div class="vt ${S.sub==='type:'+type?'active':''}" data-s="type:${type}">${TYPE_LABEL[type]}</div>`;
  }
  tabs += `<div class="vt ${S.sub==='needs'?'active':''}" data-s="needs" style="color:${needBadge?'var(--warn)':''}">需要补全${needBadge?` (${needBadge})`:''}</div>`;
  return `<div class="viewtabs">${tabs}</div>`;
}

function filteredTasks() {
  let list = S.tasks;
  if (S.sub.startsWith('tag:')) list = list.filter((t) => t.tags?.some((tag) => tag.id === S.sub.slice(4)));
  else if (S.sub.startsWith('type:')) list = list.filter((t) => t.type === S.sub.slice(5));
  else if (S.sub === 'needs') list = list.filter((t) => t.status === 'inactive');
  if (S.q) { const q = S.q.toLowerCase(); list = list.filter((t) => (t.title + t.content).toLowerCase().includes(q)); }
  return list;
}

function fmtNext(t) {
  if (!t.next_run_at) return '—';
  const d = new Date(t.next_run_at * 1000);
  return d.toLocaleString(undefined, { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function pageTasks() {
  const list = filteredTasks();
  const TYPE_ICON = { asme:'🙋', bot:'🤖', ai_report:'📊', outreach:'💬', agent_task:'🛠', jira_automation:'⚙' };
  const TYPE_COLOR = { asme:'var(--t-asme)', bot:'var(--t-bot)', ai_report:'var(--t-report)', outreach:'var(--t-outreach)', agent_task:'var(--t-agent)', jira_automation:'var(--t-jira)' };
  const rows = list.map((t) => `
    <tr>
      <td>
        <div style="display:flex;gap:11px;align-items:flex-start">
          <span class="typeic" style="background:color-mix(in srgb, ${TYPE_COLOR[t.type]||'var(--brand)'} 14%, transparent);color:${TYPE_COLOR[t.type]||'var(--brand)'}">${TYPE_ICON[t.type]||'•'}</span>
          <div style="flex:1">
            <a data-open="${t.id}" style="cursor:pointer" class="trow-title">${esc(t.title)}</a>
            <div class="muted" style="margin:1px 0 3px">${TYPE_LABEL[t.type]||t.type}${t.content?' · '+esc(String(t.content).slice(0,40))+(String(t.content).length>40?'…':''):''}</div>
            <div>${(t.tags||[]).map((g)=>`<span class="tag">#${esc(g.name)}</span>`).join('')}</div>
            ${t.missing?.length?`<div class="muted" style="color:var(--warn);margin-top:3px">待补全：${t.missing.map(esc).join('、')}</div>`:''}
          </div>
        </div></td>
      <td><span class="pill ${t.status}">${{active:'运行中',paused:'已暂停',inactive:'未启用',needs_attention:'需注意'}[t.status]||t.status}</span></td>
      <td>${fmtNext(t)}</td>
      <td style="white-space:nowrap">
        ${t.status==='active'?`<button class="ghost small" data-pause="${t.id}">暂停</button>`:''}
        ${['paused','inactive'].includes(t.status)?`<button class="small" data-enable="${t.id}">启用</button>`:''}
        <button class="ghost small" data-del="${t.id}">删除</button>
      </td>
    </tr>`).join('');
  return `
  ${viewTabs()}
  <div class="row" style="margin-bottom:12px">
    <input type="text" id="q" placeholder="搜索任务…" value="${esc(S.q)}" style="flex:1;min-width:200px">
    <button id="new-task">＋ 新建任务</button>
  </div>
  <div class="card" style="padding:0;overflow-x:auto">
    <table><thead><tr><th>任务</th><th>状态</th><th>下次运行</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="4" class="muted" style="text-align:center;padding:30px">暂无任务</td></tr>'}</tbody></table>
  </div>`;
}

function pageTags() {
  return `
  <div class="card">
    <h2>标签（多对多分组）</h2>
    <div class="muted" style="margin-bottom:12px">一个任务可属于多个标签；按任务类型切换只是视图，不复制任务。删除标签不删除任务。</div>
    <div class="row" style="margin-bottom:14px"><input id="tag-name" placeholder="新标签名称"><button id="tag-add">添加</button></div>
    <table><thead><tr><th>标签</th><th>任务数</th><th></th></tr></thead><tbody>
    ${S.tags.map((t)=>`<tr><td>#${esc(t.name)}</td><td>${t.taskCount}</td>
      <td>${t.taskCount?'':''}<button class="ghost small" data-share-tag="${t.id}">分享</button> <button class="ghost small danger" data-tag-del="${t.id}">删除</button></td></tr>`).join('')}
    </tbody></table>
  </div>`;
}

function pageShares() {
  return `
  <div class="card">
    <h2>我的分享</h2>
    <div class="muted" style="margin-bottom:12px">分享是标签的<b>实时视图</b>：分组变化随时反映，无版本概念。导入方获得独立副本。撤销后链接立即失效，已导入副本不受影响。</div>
    <table><thead><tr><th>分组</th><th>链接</th><th>导入人数</th><th>状态</th><th></th></tr></thead><tbody>
    ${S.shares.map((s)=>`<tr>
      <td>#${esc(s.sourceTagName)}</td>
      <td><span class="muted">/share/${esc(s.token)}</span> <button class="ghost small" data-copy="${s.token}">复制</button></td>
      <td>${s.importCount}</td>
      <td>${s.revoked?'<span class="pill inactive">已撤销</span>':'<span class="pill active">已发布</span>'}</td>
      <td>${s.revoked?'':`<button class="ghost small danger" data-revoke="${s.token}">撤销</button>`}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="muted">暂无分享。到「标签」页选择一个标签进行分享。</td></tr>'}
    </tbody></table>
  </div>`;
}

function connForm(key, fields, hint) {
  return `
  <div class="card"><h2>${key}</h2><div class="muted" style="margin-bottom:10px">${hint}</div>
    <div class="grid2">${fields.map((f)=>`<div class="field"><label>${f[0]}</label><input id="conn-${key}-${f[1]}" ${f[2]||''}></div>`).join('')}</div>
    <div class="row"><button data-save-conn="${key}">保存</button><button class="ghost" data-test-conn="${key}">测试连接</button><span class="muted" id="conn-result-${key}"></span></div>
  </div>`;
}

function pageSettings() {
  return `
  <div class="card">
    <h2>账号与登录令牌</h2>
    <div class="muted" style="margin-bottom:10px">登录身份：<b>${esc(S.user.email)}</b>。登录令牌相当于你的 PAT：用于本页登录、扩展绑定与脚本调用，仅显示一次，可随时新建/吊销。它不是 memory 同步凭据（帮我问/帮我做在下方 memory 连接里单独配置）。</div>
    <div class="row" style="margin-bottom:10px"><button id="new-token">＋ 新建登录令牌</button><span class="muted" id="new-token-out"></span></div>
    <table><thead><tr><th>标签</th><th>创建时间</th><th>最近使用</th><th></th></tr></thead><tbody id="token-rows"></tbody></table>
  </div>
  <h2>连接</h2>
  ${connForm('rc_user', [['RC Server', 'serverUrl', 'value=https://platform.ringcentral.com'], ['用户 JWT Token', 'token', ''], ['我的 ChatId（通知收件）', 'ownChatId', '']], '以我的身份发帖（AsMe）与个人运行通知。Token 过期后需重新授权。')}
  ${connForm('rc_bot', [['RC Server', 'serverUrl', 'value=https://platform.ringcentral.com'], ['Bot Client ID', 'clientId', ''], ['Bot Client Secret', 'clientSecret', ' type=password']], 'Bot 发帖使用 Client Credentials 自动获取 token，保存在服务端。')}
  ${connForm('memory', [['Base URL', 'baseUrl', 'value=http://127.0.0.1:3210'], ['个人 User Key (pak.*)', 'userKey', ' type=password']], '帮我问/帮我做经 memory-service 执行；填写你的个人 key（禁止服务总 key）。')}
  ${connForm('multica', [['Webhook URL', 'webhookUrl', ' placeholder=https://…/api/webhooks/autopilots/…'], ['Binding UUID', 'bindingUuid', '']], '帮我做(Multica) 到期直接 POST Autopilot webhook；幂等键 pai:{binding}:{execution}。')}
  ${connForm('jira', [['Base URL', 'baseUrl', ''], ['Token', 'token', ' type=password']], 'AI Report 的 JQL 数据源。')}
  <div class="card">
    <h2>Timeline 数据源（部署级）</h2>
    <div class="muted" style="margin-bottom:10px">Release Info 拉取地址（可用 {project} 占位）。刷新间隔分钟（默认 1440，H13 待验证）、宽限窗口小时（默认 6）。</div>
    <div class="grid2">
      <div class="field"><label>sourceUrl</label><input id="set-timeline.sourceUrl"></div>
      <div class="field"><label>refreshMinutes</label><input id="set-timeline.refreshMinutes" type="number"></div>
      <div class="field"><label>graceHours</label><input id="set-timeline.graceHours" type="number"></div>
    </div>
    <div class="row"><button id="save-timeline">保存</button><button class="ghost" id="refresh-timeline">立即刷新</button><span class="muted" id="timeline-result"></span></div>
  </div>`;
}

// ---------------------------------------------------------------- actions

function wire(view) {
  if (view === 'tasks') {
    document.querySelectorAll('.viewtabs .vt').forEach((v) => v.onclick = () => { S.sub = v.dataset.s; render(); });
    $('#q').oninput = (e) => { S.q = e.target.value; const el = e.target; render(); $('#q').value = el.value; $('#q').focus(); };
    $('#new-task').onclick = openCreate;
    document.querySelectorAll('[data-open]').forEach((a) => a.onclick = () => openDetail(a.dataset.open));
    document.querySelectorAll('[data-pause]').forEach((b) => b.onclick = async () => { await api(`/tasks/${b.dataset.pause}/status`, { method: 'POST', body: JSON.stringify({ status: 'paused' }) }); await reload(); });
    document.querySelectorAll('[data-enable]').forEach((b) => b.onclick = async () => {
      const r = await api(`/tasks/${b.dataset.enable}/status`, { method: 'POST', body: JSON.stringify({ status: 'active' }) });
      if (r.status !== 200) alert('无法启用：' + (r.body.error || '') + (r.body.missing ? '\n缺少：' + r.body.missing.join('、') : ''));
      await reload();
    });
    document.querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => { if (confirm('删除该任务？')) { await api(`/tasks/${b.dataset.del}`, { method: 'DELETE' }); await reload(); } });
  }
  if (view === 'tags') {
    $('#tag-add').onclick = async () => { const name = $('#tag-name').value.trim(); if (name) { await api('/tags', { method: 'POST', body: JSON.stringify({ name }) }); await reload(); } };
    document.querySelectorAll('[data-tag-del]').forEach((b) => b.onclick = async () => { if (confirm('删除标签？（任务保留）')) { await api(`/tags/${b.dataset.tagDel}`, { method: 'DELETE' }); await reload(); } });
    document.querySelectorAll('[data-share-tag]').forEach((b) => b.onclick = async () => {
      const r = await api(`/tags/${b.dataset.shareTag}/share`, { method: 'POST', body: '{}' });
      if (r.status === 200) { S.view = 'shares'; await reload(); } else alert('分享失败：' + (r.body.error || ''));
    });
  }
  if (view === 'shares') {
    document.querySelectorAll('[data-copy]').forEach((b) => b.onclick = () => navigator.clipboard.writeText(location.origin + '/share/' + b.dataset.copy));
    document.querySelectorAll('[data-revoke]').forEach((b) => b.onclick = async () => { if (confirm('撤销后链接立即失效，确定？')) { await api(`/shares/${b.dataset.revoke}/revoke`, { method: 'POST' }); await reload(); } });
  }
  if (view === 'settings') {
    $('#new-token').onclick = async () => {
      const r = await api('/auth/tokens', { method: 'POST', body: JSON.stringify({ label: 'web 签发' }) });
      if (r.status !== 200) { $('#new-token-out').textContent = '签发失败'; return; }
      // one-time display with a copy button (never retrievable again)
      $('#new-token-out').innerHTML = `<span style="font-family:ui-monospace,monospace">${esc(r.body.token)}</span> <button class="ghost small" id="copy-token">复制</button>`;
      $('#copy-token').onclick = () => navigator.clipboard.writeText(r.body.token);
      loadTokens();
    };
    loadTokens();
    document.querySelectorAll('[data-save-conn]').forEach((b) => b.onclick = async () => saveConn(b.dataset.saveConn, false));
    document.querySelectorAll('[data-test-conn]').forEach((b) => b.onclick = async () => saveConn(b.dataset.testConn, true));
    $('#save-timeline').onclick = saveTimeline;
    $('#refresh-timeline').onclick = async () => { const r = await api('/timeline/refresh', { method: 'POST', body: '{}' }); $('#timeline-result').textContent = JSON.stringify(r.body); };
    loadSettings();
  }
}

async function saveConn(key, test) {
  const ids = { rc_user: ['serverUrl','token','ownChatId'], rc_bot: ['serverUrl','clientId','clientSecret'], memory: ['baseUrl','userKey'], multica: ['webhookUrl','bindingUuid'], jira: ['baseUrl','token'] };
  const value = {};
  for (const f of ids[key]) { const el = $(`#conn-${key}-${f}`); if (el) value[f] = el.value.trim(); }
  if (!test) {
    const r = await api(`/connections/${key}`, { method: 'PUT', body: JSON.stringify({ value }) });
    $(`#conn-result-${key}`).textContent = r.status === 200 ? '已保存' : '保存失败';
  }
  const r2 = await api(`/connections/${key}/test`, { method: 'POST', body: JSON.stringify({ value }) });
  $(`#conn-result-${key}`).textContent = r2.body.ok === true ? `连接正常 ${r2.body.detail ? JSON.stringify(r2.body.detail) : ''}` : `失败：${r2.body.error || '未知'}`;
}

async function loadTokens() {
  const r = await api('/auth/tokens');
  const rows = (r.body || []).map((t) => `<tr>
    <td>${esc(t.label || '—')}</td>
    <td class="muted">${new Date(t.created_at * 1000).toLocaleDateString()}</td>
    <td class="muted">${t.lastUsed ? '是' : '未使用'}</td>
    <td><button class="ghost small danger" data-tok-del="${t.id}">吊销</button></td>
  </tr>`).join('');
  const el = $('#token-rows');
  if (el) {
    el.innerHTML = rows || '<tr><td colspan="4" class="muted">无令牌</td></tr>';
    el.querySelectorAll('[data-tok-del]').forEach((b) => b.onclick = async () => {
      if (!confirm('吊销后用该令牌的登录/扩展绑定会立即失效，确定？')) return;
      await api(`/auth/tokens/${b.dataset.tokDel}`, { method: 'DELETE' });
      loadTokens();
    });
  }
}

async function loadSettings() {
  const r = await api('/settings');
  for (const [k, v] of Object.entries(r.body || {})) { const el = $(`#set-${k}`); if (el) el.value = v; }
}

async function saveTimeline() {
  for (const k of ['sourceUrl','refreshMinutes','graceHours']) {
    const el = $(`#set-timeline.${k}`); if (el && el.value) await api(`/settings/timeline.${k}`, { method: 'PUT', body: JSON.stringify({ value: el.value }) });
  }
  $('#timeline-result').textContent = '已保存';
}

async function reload() { await refresh(); render(); }

// ---------------------------------------------------------------- create

function openCreate() {
  const tagsHtml = S.tags.map((t) => `<label style="margin-right:10px"><input type="checkbox" class="ct" value="${t.id}"> #${esc(t.name)}</label>`).join('');
  $('#drawer').innerHTML = `
  <h2>新建任务</h2>
  <div class="field"><label>类型</label>
    <select id="c-type">${Object.entries(TYPE_LABEL).filter(([k])=>k!=='jira_automation').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
  <div class="field"><label>标题</label><input id="c-title"></div>
  <div class="field"><label>内容 / 执行指令（只描述要做什么，收件人与格式在下方配置）</label><textarea id="c-content"></textarea></div>
  <h3>时间</h3>
  <div class="grid2">
    <div class="field"><label>方式</label><select id="c-kind">
      <option value="cron">按 CRON</option><option value="one_shot">单次</option><option value="rate">固定间隔</option><option value="timeline">Timeline（发布节点）</option></select></div>
    <div class="field"><label>时区</label><input id="c-tz" value="Asia/Shanghai"></div>
    <div class="field c-cron"><label>CRON（分 时 日 月 周，支持 6 段含秒）</label><input id="c-cron" value="30 9 * * *" placeholder="30 9 * * *"></div>
    <div class="field c-one" style="display:none"><label>时间</label><input id="c-when" type="datetime-local"></div>
    <div class="field c-rate" style="display:none"><label>间隔（分钟）</label><input id="c-rate" type="number" value="60"></div>
    <div class="field c-timeline" style="display:none"><label>项目</label><input id="c-project" placeholder="mThor"></div>
    <div class="field c-timeline" style="display:none"><label>里程碑</label><input id="c-milestone" placeholder="FF"></div>
    <div class="field c-timeline" style="display:none"><label>偏移天数（±，发布日前为负）</label><input id="c-offset" type="number" value="-2"></div>
    <div class="field c-timeline" style="display:none"><label>发送时刻</label><input id="c-time" value="09:30"></div>
  </div>
  <h3>投递对象（asme/bot/ai_report）</h3>
  <div class="field"><label>Chat ID</label><input id="c-chat" placeholder="Glip chat id"></div>
  <div class="agent-only" style="display:none">
    <h3>执行与投递（帮我做）</h3>
    <div class="grid2">
      <div class="field"><label>执行器</label><select id="c-executor"><option value="memory">memory-service（OpenClaw/ACP/worker）</option><option value="multica">Multica Autopilot</option></select></div>
      <div class="field"><label>模式</label><select id="c-mode"><option value="read">read（只读）</option><option value="write">write（可写）</option></select></div>
    </div>
    <div class="field"><label>运行通知 → 通知我</label><select id="c-notify"><option value="every">每次完成</option><option value="failures">仅失败</option><option value="off">关闭</option></select></div>
    <div class="field"><label>发布任务产出 → 发送到群</label><select id="c-pub"><option value="off">关闭（默认）</option><option value="final_output">直接发送最终产出</option><option value="template">按模板生成</option></select></div>
    <div class="field" id="c-pub-recipients-wrap" style="display:none"><label>发布对象 Chat ID（逗号分隔）</label><input id="c-pub-recipients"></div>
    <div class="field" id="c-pub-template-wrap" style="display:none"><label>模板字段（每行：名称 | 给执行器的说明 | 必填y/n）</label><textarea id="c-pub-template">标题 | 一句话标题 | y\n风险 | 风险点 | y\n备注 | 可选补充 | n</textarea></div>
  </div>
  <h3>标签</h3><div>${tagsHtml || '<span class="muted">暂无标签</span>'}</div>
  <div class="row" style="margin-top:16px"><button id="c-save">创建</button><button class="ghost" id="c-cancel">取消</button><span class="muted" id="c-err"></span></div>`;
  $('#backdrop').classList.add('show'); $('#drawer').classList.add('open');
  const syncKind = () => {
    const kind = $('#c-kind').value;
    for (const k of ['cron','one','rate','timeline']) document.querySelectorAll(`.c-${k}`).forEach((el) => el.style.display = k === kind || (k==='cron'&&kind==='cron') ? '' : 'none');
    document.querySelectorAll('.c-cron').forEach((el)=>el.style.display = kind==='cron'?'':'none');
    document.querySelectorAll('.c-one').forEach((el)=>el.style.display = kind==='one_shot'?'':'none');
    document.querySelectorAll('.c-rate').forEach((el)=>el.style.display = kind==='rate'?'':'none');
    document.querySelectorAll('.c-timeline').forEach((el)=>el.style.display = kind==='timeline'?'':'none');
  };
  $('#c-kind').onchange = syncKind; syncKind();
  const syncType = () => {
    const t = $('#c-type').value;
    document.querySelectorAll('.agent-only').forEach((el)=>el.style.display = t==='agent_task'?'':'none');
  };
  $('#c-type').onchange = syncType; syncType();
  $('#c-cancel').onclick = closeDrawer;
  $('#c-save').onclick = doCreate;
}

function closeDrawer() { $('#drawer').classList.remove('open'); $('#backdrop').classList.remove('show'); }
$('#backdrop').onclick = closeDrawer;

async function doCreate() {
  const type = $('#c-type').value;
  const kind = $('#c-kind').value;
  const tz = $('#c-tz').value || 'Asia/Shanghai';
  let scheduleSpec;
  if (kind === 'cron') scheduleSpec = { kind, expr: $('#c-cron').value, timezone: tz };
  else if (kind === 'one_shot') scheduleSpec = { kind, dateTime: Math.floor(new Date($('#c-when').value).getTime() / 1000), timezone: tz };
  else if (kind === 'rate') scheduleSpec = { kind, intervalMinutes: Number($('#c-rate').value) };
  else scheduleSpec = { kind, project: $('#c-project').value, milestone: $('#c-milestone').value, offsetDays: Number($('#c-offset').value), time: $('#c-time').value, timezone: tz };
  const config = {};
  if (['asme','bot'].includes(type)) config.chatId = $('#c-chat').value;
  if (type === 'agent_task') { config.executor = $('#c-executor').value; config.mode = $('#c-mode').value; }
  const notify = {};
  if (type === 'agent_task') {
    notify.notifyMe = { mode: $('#c-notify').value };
    const pub = $('#c-pub').value;
    notify.publish = pub === 'off' ? { enabled: false } : {
      enabled: true,
      recipients: ($('#c-pub-recipients').value || '').split(',').map((s) => s.trim()).filter(Boolean).map((chatId) => ({ chatId })),
      identity: 'user',
      source: pub,
      template: pub === 'template'
        ? $('#c-pub-template').value.split('\n').map((line) => { const [name, note, req] = line.split('|').map((s) => (s || '').trim()); return name ? { name, note, required: req !== 'n' } : null; }).filter(Boolean)
        : [],
    };
  }
  const tagIds = [...document.querySelectorAll('.ct:checked')].map((el) => el.value);
  const body = { type, title: $('#c-title').value, content: $('#c-content').value, scheduleSpec, config, notify, tagIds };
  const r = await api('/tasks', { method: 'POST', body: JSON.stringify(body) });
  if (r.status === 200) { closeDrawer(); await reload(); if (r.body.missing?.length) alert('任务已创建，但缺少配置，未启用：' + r.body.missing.join('、')); }
  else $('#c-err').textContent = r.body.error || '创建失败';
}

// ---------------------------------------------------------------- detail

async function openDetail(taskId) {
  const [t, runs] = await Promise.all([api(`/tasks/${taskId}`), api(`/tasks/${taskId}/runs`)]);
  if (t.status !== 200) return;
  S.detail = t.body;
  const runRows = (runs.body || []).map((r) => `
    <div class="run">
      <div class="row" style="justify-content:space-between">
        <span>${new Date(r.scheduled_for * 1000).toLocaleString()}</span>
        <span class="pill ${r.status}">${r.status}</span>
        ${r.publish_status?`<span class="badge pub-${r.publish_status.split('_')[1]||'none'}">发布: ${{published:'已发布',paused:'暂停',skipped:'跳过',pending:'待发布'}[r.publish_status.split('_')[1]]||r.publish_status}</span>`:''}
      </div>
      ${r.note?`<div class="muted">${esc(r.note)}</div>`:''}
      ${r.result?.summaryForOwner?`<div>${esc(r.result.summaryForOwner)}</div>`:''}
      ${r.error?`<div style="color:var(--bad)">${esc(typeof r.error==='string'?r.error:JSON.stringify(r.error))}</div>`:''}
      ${r.publishReason?`<div style="color:var(--warn)">发布暂停：${esc(r.publishReason)}${r.publishError?.missing?'（缺少 '+r.publishError.missing.join('、')+'）':''}</div>`:''}
      <div class="row" style="margin-top:6px">
        ${r.status==='needs_attention'?`<button class="small" data-resend="${r.id}">立即发送</button><button class="ghost small" data-skip="${r.id}">跳过</button>`:''}
        ${r.publish_status==='publish_paused'?`<button class="small" data-retry-pub="${r.id}">仅重试发布</button>`:''}
        ${r.status==='succeeded'&&r.publish_status==='publish_pending'?`<button class="ghost small" data-pub="${r.id}">发布</button>`:''}
      </div>
    </div>`).join('');
  $('#drawer').innerHTML = `
  <h2>${esc(t.body.title)}</h2>
  <div class="muted">${TYPE_LABEL[t.body.type]} · ${(t.body.tags||[]).map((g)=>`<span class="tag">#${esc(g.name)}</span>`).join('')}</div>
  <div class="muted">下次运行：${fmtNext(t.body)} · 状态：${t.body.status}</div>
  ${t.body.missing?.length?`<div style="color:var(--warn)">需要补全：${t.body.missing.map(esc).join('、')}</div>`:''}
  <div class="card" style="margin-top:12px"><b>内容/指令</b><div style="white-space:pre-wrap">${esc(t.body.content)}</div></div>
  <div class="row" style="margin:12px 0"><button class="ghost small" data-trial="${t.body.id}">试运行（不真实发送）</button><span class="muted" id="trial-out"></span></div>
  <h3>运行记录</h3>
  ${runRows || '<div class="muted">暂无运行</div>'}`;
  $('#backdrop').classList.add('show'); $('#drawer').classList.add('open');
  document.querySelectorAll('[data-resend]').forEach((b)=>b.onclick=async()=>{await api(`/runs/${b.dataset.resend}/resend`,{method:'POST',body:'{}'});openDetail(taskId);});
  document.querySelectorAll('[data-skip]').forEach((b)=>b.onclick=async()=>{await api(`/runs/${b.dataset.skip}/skip`,{method:'POST',body:'{}'});openDetail(taskId);});
  document.querySelectorAll('[data-retry-pub]').forEach((b)=>b.onclick=async()=>{const r=await api(`/runs/${b.dataset.retryPub}/publish/retry`,{method:'POST',body:'{}'});if(r.status!==200)alert(r.body.error);openDetail(taskId);});
  document.querySelectorAll('[data-pub]').forEach((b)=>b.onclick=async()=>{const r=await api(`/runs/${b.dataset.pub}/publish`,{method:'POST',body:'{}'});if(r.status!==200)alert(r.body.error);openDetail(taskId);});
  document.querySelectorAll('[data-trial]').forEach((b)=>b.onclick=async()=>{
    const r = await api(`/tasks/${b.dataset.trial}/trial`, { method: 'POST', body: '{}' });
    if (r.status !== 200) { $('#trial-out').textContent = '试运行失败'; return; }
    const b_ = r.body;
    // H12 honesty: trial NEVER executes the task (no provider is invoked) —
    // write-mode dry-run is not supported by the executors, so the preview is
    // notification/publish-shape only and is clearly labeled as such.
    $('#trial-out').innerHTML = [
      `<b>试运行预览（不执行任何真实操作、不发送）</b>`,
      b_.notifyPreview ? `通知我预览：${esc(typeof b_.notifyPreview === 'string' ? b_.notifyPreview : JSON.stringify(b_.notifyPreview))}` : '',
      b_.publishPreview ? `发布预览：${esc(JSON.stringify(b_.publishPreview))}` : '',
      `write 模式任务暂不支持真实执行预览（执行器无 dry-run 能力，H12）；此处仅展示通知与发布形态。`,
    ].filter(Boolean).join('<br>');
  });
}

boot();
</script>
