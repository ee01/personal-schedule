<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Schedule · 分享</title>
<style>
/* dark tokens aligned with the confirmed prototype / main app */
:root{--bg:#0a0c0f;--bg2:#0e1116;--card:#12151a;--line:#232932;--line2:#2c333e;--ink:#e8eaed;--muted:#8b93a1;--faint:#5c6470;--brand:#7c8cff;--brand-soft:rgba(124,140,255,.13);--ok:#4ade80;--ok-soft:rgba(74,222,128,.13);--warn:#fbbf24;--warn-soft:rgba(251,191,36,.13);--bad:#f87171;--bad-soft:rgba(248,113,113,.13);--t-asme:#7fe0c3;--t-bot:#76b8ff;--t-report:#f2b24c;--t-outreach:#f58d7a;--t-agent:#b9a4ff;--t-jira:#e2a4ff}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 500px at 70% -10%,rgba(124,140,255,.07),transparent),var(--bg);color:var(--ink)}
.wrap{max-width:960px;margin:32px auto;padding:0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px;font-weight:700}.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;background:var(--bg2)}
.task input[type=checkbox]{margin-top:4px;width:16px;height:16px;accent-color:var(--brand)}
.task .t-title{font-weight:600}.task .t-meta{color:var(--muted);font-size:12px;margin-top:2px}
.tag{display:inline-block;background:color-mix(in srgb,var(--t-asme) 12%,transparent);color:var(--t-asme);border-radius:6px;padding:1px 8px;font-size:11.5px;margin-right:6px}
.task .tag{background:var(--brand-soft);color:var(--brand)}
.sensitive{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:1px 8px;font-size:11.5px}
button{background:var(--brand);color:#0a0c0f;border:0;border-radius:9px;padding:8px 16px;font-size:13.5px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);font-weight:500}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=password],select{border:1px solid var(--line2);border-radius:9px;padding:8px 11px;font-size:14px;background:var(--bg2);color:var(--ink);font-family:inherit}
input:focus{outline:none;border-color:var(--brand)}
.result{padding:10px;border-radius:9px;margin-top:8px;font-size:13px}
.result.ok{background:var(--ok-soft);color:var(--ok)}.result.err{background:var(--bad-soft);color:var(--bad)}.result.warn{background:var(--warn-soft);color:var(--warn)}
.hint{font-size:12px;color:var(--muted)}
a{color:var(--brand)}
#ext-banner{display:none;background:var(--brand-soft);border:1px solid rgba(124,140,255,.35);color:var(--ink);border-radius:11px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.ext-card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;background:var(--card)}
.ext-steps{display:flex;gap:14px;margin:12px 0}
.ext-step{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;text-align:center;font-size:13px;background:var(--bg2)}
.ext-step .n{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:50%;background:var(--brand);color:#0a0c0f;font-size:12px;margin-bottom:4px;font-weight:700}
.ext-step.cur{border-color:rgba(124,140,255,.45)}
.pill.live{display:inline-flex;align-items:center;gap:6px;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:3px 12px;font-size:12px;border:1px solid rgba(251,191,36,.3)}
.pill.live .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="wrap">
  <div id="ext-banner"></div>
  <div id="ext-card" class="ext-card" style="display:none"></div>
  <div id="share"></div>
</div>
<script>
const state = { token: location.pathname.split('/').pop(), data: null, session: null };
const api = (path, opts) => fetch(`/api/v1${path}`, {
  headers: { 'Content-Type': 'application/json' }, credentials: 'include', ...opts,
}).then(async (r) => ({ status: r.status, body: await r.json().catch(() => ({})) }));

function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function fmtSpec(spec){
  if(!spec) return '';
  if(spec.kind==='one_shot') return `单次 · ${new Date(spec.dateTime*1000).toLocaleString()}`;
  if(spec.kind==='cron') return `CRON · ${spec.expr} (${spec.timezone||''})`;
  if(spec.kind==='rate') return `每 ${spec.intervalMinutes} 分钟`;
  if(spec.kind==='timeline') return `Timeline · ${esc(spec.project)} / ${esc(spec.milestone)} ${spec.offsetDays>0?'+':''}${spec.offsetDays||0}天 ${spec.time}`;
  return spec.kind;
}

async function loadShare(){
  const { status, body } = await api(`/shares/${state.token}`);
  if (status !== 200) { document.getElementById('share').innerHTML = `<div class="card"><h1>分享不可用</h1><div class="sub">${esc(body.error||'链接已失效')}</div></div>`; return; }
  state.data = body;
  const me = await api('/me');
  state.session = me.status === 200 ? me.body : null;
  render();
}

function render(){
  const d = state.data;
  const tasksHtml = d.tasks.map((t, i) => `
    <label class="task">
      <input type="checkbox" data-i="${i}" checked>
      <div>
        <div class="t-title">${esc(t.title)} <span class="tag">${t.type}</span>${t.sensitivity?`<span class="sensitive">⚠ 敏感内容</span>`:''}</div>
        <div class="t-meta">${esc(fmtSpec(t.scheduleSpec))}</div>
        <div class="t-meta">${esc((t.content||'').slice(0,140))}</div>
      </div>
    </label>`).join('');
  document.getElementById('share').innerHTML = `
    <div class="card">
      <h1>「${esc(d.sourceTagName)}」任务包</h1>
      <div class="sub">实时视图 · ${d.tasks.length} 个任务 · 分组变化会实时反映在本页 · 导入后为你的独立副本（不含发送方凭证/历史）</div>
      ${state.session?'':`<div class="hint" style="margin-bottom:10px">导入需要你的 Personal Schedule 身份：先在下方登录（或在已安装的 Personal AI 扩展中导入）。</div>`}
      <div class="row" style="margin-bottom:14px">
        ${state.session
          ? `<span class="hint">已登录：${esc(state.session.email)}</span>`
          : `<input type="password" id="login-token" placeholder="你的 Schedule API Token" style="flex:1;min-width:240px">
             <button class="ghost" id="login-btn">登录</button>`}
      </div>
      ${tasksHtml}
      <div class="row" style="margin-top:14px">
        <button id="import-btn" ${state.session?'':'disabled'}>导入选中任务</button>
        <span class="hint" id="import-hint"></span>
      </div>
      <div id="import-result"></div>
    </div>`;
  if (!state.session) document.getElementById('login-btn').onclick = async () => {
    const token = document.getElementById('login-token').value.trim();
    const r = await api('/auth/login', { method: 'POST', body: JSON.stringify({ token }) });
    if (r.status === 200) loadShare(); else alert('Token 无效');
  };
  document.getElementById('import-btn').onclick = doImport;
}

async function doImport(){
  const selected = [...document.querySelectorAll('input[data-i]:checked')].map((el) => state.data.tasks[+el.dataset.i].refKey);
  if (selected.length === 0) { alert('请至少勾选一个任务'); return; }
  const requestId = 'imp-' + crypto.randomUUID();
  let r = await api(`/shares/${state.token}/import`, { method: 'POST', body: JSON.stringify({ selected, requestId }) });
  if (r.body.needConfirm) {
    if (!confirm(`以下任务你已导入过：\n${r.body.duplicates.map((t)=>t.title).join('\n')}\n\n再次导入将创建额外副本，确定？`)) return;
    r = await api(`/shares/${state.token}/import`, { method: 'POST', body: JSON.stringify({ selected, requestId: requestId + '-c', confirmDuplicates: true }) });
  }
  const out = document.getElementById('import-result');
  if (r.status === 200) {
    const rows = r.body.results.map((res) => `<div class="result ${res.status==='failed'?'err':'ok'}">${res.status==='failed'?'❌ 失败：'+esc(res.reason):'✅ 已导入（默认未启用，请到「需要补全」中绑定收件人/执行器后启用）'}</div>`).join('');
    out.innerHTML = rows + `<div class="hint" style="margin-top:8px">导入的任务为独立副本，不随本分享变化。到 <a href="/app">Personal Schedule</a> 的「需要补全」中完成配置。</div>`;
  } else {
    out.innerHTML = `<div class="result err">导入失败：${esc(r.body.error||r.status)}</div>`;
  }
}

// extension presence (E-184 new handshake): the Personal AI extension's
// content script announces
//   {channel:'personal-schedule-extension-v1', type:'ready', version, schemaVersion}
// with this page's origin as the target. The page listens and never replies on
// that channel — the old 'personal-schedule' window channel is retired (its
// handler replied to every message and echoed indefinitely). Credentials and
// imports go through authenticated extension runtime messaging; the
// extension builds its own receiver-owned import panel from the /share/:token
// URL. This page's own login+import below stays equivalent for no-extension
// users.
const extState = { phase: 'install', version: null }; // install → waiting → ready | upgrade

function versionOlder(version, min) {
  const parse = (v) => String(v || '0').split('.').map((part) => Number.parseInt(part, 10) || 0);
  const a = parse(version);
  const b = parse(min);
  for (let i = 0; i < Math.max(a.length, b.length); i += 1) {
    const diff = (a[i] || 0) - (b[i] || 0);
    if (diff !== 0) return diff < 0;
  }
  return false;
}

function saveSelection() {
  try {
    const selected = [...document.querySelectorAll('input[data-i]:checked')].map((el) => el.dataset.i);
    sessionStorage.setItem('ps-share-sel-' + state.token, JSON.stringify(selected));
  } catch { /* sessionStorage unavailable */ }
}

function restoreSelection() {
  try {
    const saved = JSON.parse(sessionStorage.getItem('ps-share-sel-' + state.token) || 'null');
    if (Array.isArray(saved)) {
      for (const el of document.querySelectorAll('input[data-i]')) el.checked = saved.includes(el.dataset.i);
    }
  } catch { /* ignore */ }
}

document.addEventListener('change', (e) => { if (e.target.matches('input[data-i]')) saveSelection(); });

function renderExtPhase() {
  const banner = document.getElementById('ext-banner');
  const card = document.getElementById('ext-card');
  if (!card) return;
  if (extState.phase === 'ready') {
    banner.style.display = 'block';
    banner.textContent = '已检测到 Personal AI 扩展' + (extState.version ? `（v${extState.version}）` : '') + '，可在扩展中一键导入本任务包；你的勾选已保留。';
    card.style.display = 'none';
    return;
  }
  banner.style.display = 'none';
  card.style.display = 'block';
  const up = extState.phase === 'upgrade';
  card.innerHTML = `
    <div class="row" style="align-items:flex-start;gap:12px">
      <b>${up ? '需要更新 Personal AI 扩展' : '导入需要 Personal AI 扩展'}</b>
    </div>
    <div class="sub">${up
      ? `当前扩展版本低于本分享要求（schema v${state.data?.schemaVersion || 1}），更新后会自动继续，你的勾选会保留。`
      : '扩展负责以你的身份安全地把任务写入你的账户。安装后回到这里，<b>本页会自动继续导入</b>，你的勾选已保存在当前会话。'}</div>
    <div class="ext-steps">
      <div class="ext-step cur"><span class="n">01</span><div>${up ? '更新扩展' : '安装扩展'}</div><div class="hint">${extInfo.extInstallUrl ? '<a href="' + esc(extInfo.extInstallUrl) + '" target="_blank" rel="noopener">打开安装页</a>' : 'Chrome 网上应用店（安装入口地址由部署配置，见 SCHEDULE_EXT_INSTALL_URL）'}</div></div>
      <div class="ext-step"><span class="n">02</span><div>回到本页</div><div class="hint">本页自动继续，无需重新确认</div></div>
    </div>
    <div class="row"><span class="pill live"><span class="dot"></span>等待扩展${up ? '更新' : '安装'}完成…</span></div>
    <div class="hint" style="margin-top:8px">也可以继续用页面登录 + 勾选导入（下方），两者等价。</div>`;
}

window.addEventListener('message', (event) => {
  if (event.origin !== location.origin) return; // announcement targets this page's origin only
  const data = event.data;
  if (!data || data.channel !== 'personal-schedule-extension-v1' || data.type !== 'ready') return;
  extState.version = data.version || null;
  const minV = String(extInfo.handshake?.minExtensionVersion || '0');
  const older = extState.version && versionOlder(extState.version, minV);
  extState.phase = older ? 'upgrade' : 'ready';
  renderExtPhase();
  // no reply: this channel is announcement-only (old-channel echo retired)
});

let extInfo = { extInstallUrl: null, handshake: null };
async function boot() {
  const info = await api('/extension/info');
  if (info.status === 200) extInfo = { ...extInfo, ...info.body };
  await loadShare();
  restoreSelection();
  renderExtPhase();
}
boot();
</script>
</body>
</html>
